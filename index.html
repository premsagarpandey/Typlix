<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="description" content="Master high-speed touch typing with progressive lessons, mechanical audio feedback, and multiple keyboard layouts (QWERTY, Dvorak, Colemak, AZERTY)." />
    <meta name="author" content="Prem Sagar Pandey" />
    <meta property="og:title" content="Typlix — Touch Typing Trainer" />
    <meta property="og:description" content="Master high-speed touch typing with progressive lessons, mechanical audio feedback, and multiple keyboard layouts." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Typlix — Touch Typing Trainer" />

    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <script>
      (function() {
        try {
          var t = localStorage.getItem('typlix_theme');
          if (t === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://accounts.google.com" crossorigin />
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin />
    <link rel="preconnect" href="https://typlix.web.app" crossorigin />
    <link rel="preconnect" href="https://apis.google.com" crossorigin />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/png" href="/logo.png" />

  </head>
  <body class="bg-neutral-50 dark:bg-neutral-950 text-neutral-900 dark:text-neutral-100 antialiased">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #fafafa; color: #525252; font-family: 'Inter', system-ui, sans-serif;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 14px;">
          <div style="width: 32px; height: 32px; border: 3px solid #e5e5e5; border-top-color: #171717; border-radius: 50%; animation: typlix-spin 0.8s linear infinite;"></div>
          <span style="font-size: 13px; font-weight: 500; letter-spacing: 0.03em; color: #737373;">Loading Typlix...</span>
        </div>
      </div>
      <style>
        @keyframes typlix-spin {
          to { transform: rotate(360deg); }
        }
      </style>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
